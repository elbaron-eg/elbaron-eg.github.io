<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#13254A"><title>البارون | المخازن</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&family=Cinzel:wght@500;600&family=El+Messiri:wght@600&display=swap">
<style>



:root{--bg:#F3F5FA;--surface:#FFFFFF;--surface-2:#F7F8FC;--line:#E1E6EF;--line-2:#CDD5E3;--ink:#121A2E;--muted:#56617A;--faint:#8791A8;--navy:#13254A;--navy-2:#1C3363;--navy-muted:#AFC0E0;--gold:#B88B2C;--gold-bright:#C9A24A;--gold-soft:#F7EFDC;--gold-ink:#5E440C;--late:#B4232A;--late-soft:#FCE8E9;--late-ink:#8E1A20;--due:#9A5800;--due-soft:#FFF1D9;--due-ink:#6E3F00;--near:#1D56C9;--near-soft:#E7EEFD;--near-ink:#163F94;--ok:#0D7449;--ok-soft:#E1F3EA;--ok-ink:#0A5A39;--r:14px;--f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--f-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",sans-serif;--sel:var(--navy);--sel-ink:#fff}
html.dark{--bg:#0B111E;--surface:#121A2B;--surface-2:#172137;--line:#24304A;--line-2:#33415F;--ink:#E6EBF5;--muted:#9AA6C0;--faint:#6F7B96;--gold-soft:#2A2414;--gold-ink:#E8CB85;--late:#F0767C;--late-soft:#2E1517;--late-ink:#F4A5A9;--due:#E0A040;--due-soft:#2C2210;--due-ink:#F0C27A;--near:#7FA6F5;--near-soft:#14213F;--near-ink:#A9C3F8;--ok:#3DBE84;--ok-soft:#0F2A20;--ok-ink:#7AD9AC;--sel:#C9A24A;--sel-ink:#0B111E}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
svg{flex:none}
@media (prefers-reduced-motion:no-preference){
 .sh{animation:up .22s ease-out}.dim{animation:fd .18s ease-out}.toast{animation:tu .25s ease-out}
 .pg{animation:pf .22s ease-out}}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fd{from{background:rgba(9,15,30,0)}}
@keyframes tu{from{transform:translate(-50%,12px);opacity:0}}
@keyframes pf{from{opacity:.4;transform:translateY(6px)}}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 100px}
.rb{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--faint);margin-bottom:12px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.rb button{padding:3px 10px;border-radius:99px;border:1px dashed var(--line-2);font:500 11.5px var(--f-display);color:var(--muted);flex:none}
.rb button.on{background:var(--sel);color:var(--sel-ink);border-color:transparent}
/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:23px;line-height:1.3}
.ph p{font-size:13px;color:var(--muted);margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;font:500 13px var(--f-display);color:var(--near);margin-bottom:6px}
.btn{height:40px;padding:0 16px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 14px var(--f-display);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--faint)}
.btn.gold{background:var(--gold-bright);border-color:var(--gold-bright);color:var(--navy)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
html.dark .btn.navy{background:#24345A;border-color:#24345A}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok-ink)}
.btn.red{background:var(--late);border-color:var(--late);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.w{width:100%;height:48px;font-size:15px;border-radius:12px}
/* welcome card — same as the sales home */
.wg{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;background:linear-gradient(120deg,#13254A 0%,#1C3363 70%,#24407A 100%);color:#fff;box-shadow:0 12px 28px rgba(19,37,74,.18);display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid rgba(255,255,255,.06)}
.wg-wm{position:absolute;left:-12px;top:-12%;bottom:-12%;height:124%;aspect-ratio:570/700;width:auto;color:#E2BE6A;opacity:.1;pointer-events:none}
.wg-wm svg{width:100%;height:100%}
.wg-main{flex:1;min-width:220px;position:relative;display:grid;gap:4px}
.wg-eb{font-size:12.5px;color:#AFC0E0}
.wg h1{font:700 28px/1.3 'El Messiri',serif}
.wg-co{font:400 13.5px/1.8 var(--f-display);color:#C9D4EC}
.wg-co b{color:#E2BE6A;font-weight:600}
.wg-co .r{color:#FFA3A8}
.wg-side{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.wg-qa{display:flex;gap:8px;flex-wrap:wrap}
.wq{height:42px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font:500 13.5px var(--f-display);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;transition:background .15s,transform .08s}
.wq:hover{background:rgba(255,255,255,.14)}
.wq:active{transform:scale(.97)}
.wq.p{background:var(--gold-bright);border-color:var(--gold-bright);color:var(--navy);font-weight:600}
/* kpis (sales style) */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--navy);padding:11px 13px;border-radius:0 0 12px 12px;display:flex;flex-direction:column;gap:1px;text-align:start;min-width:0;transition:border-color .15s,transform .1s}
html.dark .kpi{border-top-color:#3A4E7E}
.kpi:hover{border-color:var(--line-2)}
.kpi:active{transform:translateY(1px)}
.kpi .kl{font-size:12.5px;color:var(--muted)}
.kpi .kv{font:600 22px/1.3 var(--f-display)}
.kpi .ks{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.ok{border-top-color:var(--ok)}
.kpi.gd{border-top-color:var(--gold-bright)}
.kpi.due{border-top-color:var(--due)}
.kpi.late{border-top-color:var(--late)}
.kpi.near{border-top-color:var(--near)}
.kpi.late .kv{color:var(--late)}
.kpi.due .kv{color:var(--due)}
.kpi.near .kv{color:var(--near)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
.c4{grid-column:span 4}
.c5{grid-column:span 5}
.c6{grid-column:span 6}
.c7{grid-column:span 7}
.c8{grid-column:span 8}
.c12{grid-column:span 12}
.stack{display:grid;gap:14px}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.pnh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pnh h2{font-size:15px;display:flex;align-items:center;gap:8px}
.pnh .count{font:600 11.5px var(--f-body);padding:1px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.pnh .lk{font:500 12.5px var(--f-display);color:var(--near)}
.pnote{padding:8px 14px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);line-height:1.7}
.dot{width:8px;height:8px;border-radius:50%;background:var(--late);flex:none}
.dot.due{background:var(--due)}
.dot.near{background:var(--near)}
.dot.ok{background:var(--ok)}
.dot.gd{background:var(--gold-bright)}
.rw{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:start;transition:background .12s;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
button.rw:hover{background:var(--surface-2)}
.rw .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.ic.o{background:var(--gold-soft);color:var(--gold)}
.ic.i{background:var(--ok-soft);color:var(--ok)}
.ic.r{background:var(--late-soft);color:var(--late)}
.ic.n{background:var(--near-soft);color:var(--near)}
.ic.d{background:var(--due-soft);color:var(--due)}
html.dark .ic.o{color:var(--gold-bright)}
.rw .t{flex:1;min-width:0}
.rw .t b{display:block;font:500 14.5px var(--f-display)}
.rw .t small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.rw .v{text-align:left;flex:none}
.rw .v b{display:block;font:600 16px var(--f-display)}
.rw .v small{font-size:11.5px;color:var(--faint)}
.rw .ch{color:var(--faint);flex:none}
.empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.late{background:var(--late-soft);color:var(--late-ink)}
.pill.due{background:var(--due-soft);color:var(--due-ink)}
.pill.near{background:var(--near-soft);color:var(--near-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pls{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
/* table (desktop) */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:500 12px var(--f-display);color:var(--muted);text-align:start;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td b{font:500 14.5px var(--f-display)}
.tbl td small{display:block;font-size:12px;color:var(--muted)}
.tbl .n{font:600 15px var(--f-display);text-align:center}
.tbl th.n{text-align:center}
/* bars */
.bars{padding:12px 14px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.bar b{font:500 13.5px var(--f-display)}
.bar span:last-child{text-align:left;font:600 13px var(--f-display)}
.trk{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.trk i{display:block;height:100%;border-radius:9px;background:var(--navy);transition:width .6s ease}
html.dark .trk i{background:var(--gold-bright)}
.lvl{display:block;height:5px;border-radius:9px;background:var(--surface-2);margin-top:6px;overflow:hidden;max-width:180px}
.lvl i{display:block;height:100%;border-radius:9px}
/* tabs */
.tg{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;max-width:100%;overflow-x:auto}
.tg button{padding:7px 14px;border-radius:9px;font:500 13.5px var(--f-display);color:var(--muted);white-space:nowrap}
.tg .on{background:var(--sel);color:var(--sel-ink)}
.srch{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--faint);margin-bottom:12px}
.srch input{flex:1;border:0;background:none;outline:0;min-width:0;font-size:14px;color:var(--ink)}
/* item page */
.oc{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.oc:last-child{border-bottom:0}
.oc .q{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:600 16px var(--f-display);background:var(--due-soft);color:var(--due);flex:none}
.oc .q.l{background:var(--late-soft);color:var(--late)}
.oc .q.k{background:var(--surface-2);color:var(--muted)}
.oc .t{flex:1;min-width:160px}
.oc .t b{display:block;font:500 14.5px var(--f-display)}
.oc .t small{display:block;font-size:12.5px;color:var(--muted)}
.oc .lt{color:var(--late)!important;font-weight:600}
.oc .dd{color:var(--due)!important;font-weight:600}
.oc .acts{display:flex;gap:6px}
/* sites */
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.site .its{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px}
.site .its span{padding:5px 10px;border-radius:9px;background:var(--surface-2);font:500 13px var(--f-display)}
.site .its i{font-style:normal;color:var(--gold);margin-inline-start:5px;font-weight:600}
.site .f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.site .f .btn{flex:1}
/* building chips */
.bchs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.bch{min-width:92px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:start;flex:none;transition:border-color .15s}
.bch b{display:block;font:600 17px var(--f-display)}
.bch small{font-size:11.5px;color:var(--muted)}
.bch.on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.bch.on small{color:inherit;opacity:.75}
.bi{display:flex;justify-content:space-between;gap:10px;padding:8px 14px 8px 14px;padding-inline-start:28px;font-size:13.5px;border-bottom:1px dashed var(--line);background:var(--surface-2)}
.bi b{font:500 13.5px var(--f-display)}
.bi small{color:var(--muted);font-size:11.5px;margin-inline-start:6px}
/* moves / approval */
.dec{display:flex;gap:6px;flex:none}
.dec button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);display:grid;place-items:center;font:600 15px var(--f-display);color:var(--faint);text-align:center}
.dec .y{background:var(--ok);border-color:var(--ok);color:#fff}
.dec .n{background:var(--late);border-color:var(--late);color:#fff}
.rj{color:var(--late)!important;font-weight:600}
.msg{padding:12px 14px;display:grid;gap:5px;border-bottom:1px solid var(--line)}
.msg:last-child{border-bottom:0}
.mh2{display:flex;justify-content:space-between;align-items:center}
.mh2 small{font-size:11.5px;color:var(--faint)}
.msg b{font:500 14.5px var(--f-display)}
.msg p{font-size:13px;color:var(--muted)}
.cin{width:74px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);text-align:center;font:600 15px var(--f-display)}
.df{min-width:64px;text-align:center;font:600 12px var(--f-display);padding:4px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);flex:none}
.df.x{background:var(--late-soft);color:var(--late)}
.rg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:3px;text-align:start;position:relative;transition:border-color .15s}
.rc:hover{border-color:var(--line-2)}
.rc .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);margin-bottom:6px}
.rc b{font:500 14.5px var(--f-display)}
.rc small{font-size:12px;color:var(--muted)}
.rc .pdf{position:absolute;top:14px;left:14px;font:600 10.5px var(--f-display);color:var(--late);background:var(--late-soft);padding:2px 7px;border-radius:6px}
.tgl{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:start;border-bottom:1px solid var(--line)}
.tgl:last-child{border-bottom:0}
.tgl .t{flex:1}
.tgl b{display:block;font:500 14px var(--f-display)}
.tgl small{display:block;font-size:12px;color:var(--muted)}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on{background:var(--ok)}
.sw.on::after{inset-inline-start:21px}
.wr2{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wr2:last-child{border-bottom:0}
.wr2 .t{flex:1;min-width:150px}
.wr2 b{display:block;font:500 14px var(--f-display)}
.wr2 small{display:block;font-size:12px;color:var(--muted)}
.wr2 select{height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;font-size:13.5px}
/* sheets */
.dim{position:fixed;inset:0;background:rgba(9,15,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;max-height:92vh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.shh{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.shh h2{flex:1;font-size:18px}
.shh h2 small{display:block;font:400 12.5px var(--f-body);color:var(--muted);margin-top:2px}
.shh .x{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.shb{padding:14px 18px 18px;display:grid;gap:16px;overflow:auto;background:var(--surface)}
.shf{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface)}
.shf .btn{flex:1;height:48px;font-size:15px;border-radius:12px}
.shf .btn.main{flex:2}
.fs{display:grid;gap:8px}
.fs+.fs{padding-top:14px;border-top:1px dashed var(--line)}
.lb{font:500 13px var(--f-display);color:var(--muted)}
.lb i{font-style:normal;color:var(--faint);font-weight:400}
.lb.req i{color:var(--late)}
.stp{display:grid;grid-template-columns:48px 1fr 48px;height:48px;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;max-width:280px}
.stp button{display:grid;place-items:center;background:var(--surface-2);font:500 22px var(--f-display);text-align:center}
.stp button[disabled]{opacity:.35}
.stp b{display:grid;place-items:center;font:600 19px var(--f-display)}
.stp b small{font:400 12px var(--f-body);color:var(--muted);margin-inline-start:4px}
.stp b{display:flex;align-items:center;justify-content:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.seg button{padding:10px 8px;text-align:center;font:500 13.5px var(--f-display);color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line-2)}
.seg .on{background:var(--sel);color:var(--sel-ink)}
.seg button small{display:block;font:400 11.5px var(--f-body);opacity:.8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font:500 13px var(--f-display);transition:background .12s}
.chips .on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.chips .ad{border-style:dashed;color:var(--muted)}
.fld{width:100%;height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:14px;outline:0}
.fld:focus{border-color:var(--navy)}
textarea.fld{height:76px;padding:10px 12px;resize:none}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--late);font-weight:600}
.ml{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ml:last-of-type{border-bottom:0}

    body=`<div class="shd"><h2>${esc(it.n)} · ${esc(b)}</h2><p>كل ما صُرف من بداية التسجيل</p></div><div class="mdk"><div class="sg"><small>الإجمالي</small><b>${nf(tot)}</b></div><div><small>عدد مرات الصرف</small><b>${M.length}</b></div></div>
    <div class="ph">حسب البند</div>${Object.entries(bands).sort((a,c)=>c[1]-a[1]).map(([k,q])=>`<div class="mdm"><span><b>${esc(k)}</b></span><b>${nf(q)} <small>${esc(u)}</small></b></div>`).join('')}
    <div class="ph">الحركات</div>${M.map(m=>`<div class="mdm" data-mv="${m.id}"><span><b>${dayName(m.d)}</b><small>${esc((m.pl===b?m.bd:m.bd2||m.bd)||'')}${m.pl2?' · مقسومة مع '+esc(m.pl===b?m.pl2:m.pl):''}</small></span><b class="sg m" dir="ltr">−${nf(qy(m))}</b></div>`).join('')}`}
  else return '';
  return `<div class="msh sh2" data-close="1"><div class="mshb"><div class="mshh"><span></span><button data-close="1" aria-label="إغلاق">✕</button></div>${body}</div></div>`}
function undo(st0,m){const s=JSON.parse(JSON.stringify(st0||{own:0,dmgNo:0,dmgFix:0,outSite:{},outPpl:{},am:{}}));const q=+m.q||0;
  const sub=(o,k)=>{if(!s[o]||!s[o][k])return;s[o][k].q=Math.round((s[o][k].q-q)*1000)/1000;if(s[o][k].q<=0)delete s[o][k]};
  if(m.t==='open'||m.t==='buy')s.own-=q;else if(m.t==='out'||m.t==='scrap')s.own+=q;else if(m.t==='dmgNo')s.dmgNo=Math.max(0,(s.dmgNo||0)-q);else if(m.t==='dmgFix')s.dmgFix=Math.max(0,(s.dmgFix||0)-q);
  else if(m.t==='amMark'){s.own+=q;sub('am',m.pl)}else if(m.t==='loan'){s.own+=q;sub('outSite',m.pl)}
  s.own=Math.round(s.own*1000)/1000;return s}
async function delMove(){const m=W.byId[W.mvs];if(!m||W.busy)return;W.busy=true;
  try{const sd=(await getDoc(fdoc(FS,'whStock/main'))).data()||{};const S2={...(sd.s||{})};S2[m.i]=undo(S2[m.i],m);
    const b=writeBatch(FS);b.delete(fdoc(FS,'whMoves/'+m.id));b.set(fdoc(FS,'whStock/main'),{...sd,s:S2,n:Math.max(0,(sd.n||1)-1),at:Date.now(),by:W.user.uid});await b.commit();
    D().stock=S2;D().n=Math.max(0,(sd.n||1)-1);delete W.byId[m.id];for(const k in W.mv)W.mv[k]=W.mv[k].filter(x=>x.id!==m.id);if(W.recent)W.recent=W.recent.filter(x=>x.id!==m.id);if(W.all)W.all=W.all.filter(x=>x.id!==m.id);
    W.mvs=null;W.sure=false;toast('تم حذف الحركة وتعديل الرصيد.')}
  catch(e){toast('تعذّر حذف الحركة. حاول مرة أخرى.',true)}W.busy=false;render()}
/* ---------- import (one time) ---------- */
function importHTML(){const I=W.imp;let body;
  if(!I)body=`<h2>بدء نظام المخازن</h2><p>لا توجد بيانات مخازن على الموقع بعد. اختر ملف بيانات المخازن (wh-import.json) لنقل الأصناف والأرصدة وكل الحركات المسجلة.</p><p>يتم هذا مرة واحدة فقط، ولا يؤثر على الوحدات والأقساط.</p><div><label class="btn gold">اختيار ملف البيانات<input id="whFile" type="file" accept=".json,application/json" hidden></label></div>`;
  else{const X=I.data;const k=Object.values(X.items);const d0=X.moves.reduce((a,m)=>m.d<a?m.d:a,'9999'),d1=X.moves.reduce((a,m)=>m.d>a?m.d:a,'');
    body=`<h2>${I.done?'تم نقل بيانات المخازن':'مراجعة البيانات قبل النقل'}</h2><div class="kps"><div><small>معدات</small><b>${k.filter(x=>x.k==='e').length}</b></div><div class="k-gd"><small>خامات</small><b>${k.filter(x=>x.k!=='e').length}</b></div><div class="k-g2"><small>حركات</small><b>${X.moves.length}</b></div><div><small>عمارات وأماكن</small><b>${(X.lists.blds||[]).length}</b></div></div>
    ${I.done?`<p>تم النقل بنجاح.</p><div><button class="btn gold" data-go="reload">فتح المخازن</button></div>`:`<p>سيتم نقل الأصناف والأرصدة والحركات من ${esc(dayYr(d0))} إلى ${esc(dayYr(d1))}.</p>${I.busy?`<div class="wprog"><i style="width:${I.pct||2}%"></i></div><p>${esc(I.msg||'')}</p>`:`<div style="display:flex;gap:8px"><button class="btn gold" data-go="doimport">نقل البيانات</button><button class="btn" data-go="cancelimp">إلغاء</button></div>`}${I.err?`<p style="color:var(--late)">${esc(I.err)}</p>`:''}`}`}
  return `<main class="wrap"><div class="pg2"><div class="wimp">${body}</div></div></main>`}
async function pickImport(f){if(!f)return;let X;try{X=JSON.parse(await f.text())}catch(e){toast('الملف غير صالح.',true);return}
  if(!X||X.app!=='elbaron-wh'||!X.items||!X.moves){toast('هذا ليس ملف بيانات المخازن.',true);return}W.imp={data:X};render()}
async function runImport(){const I=W.imp;if(!I||I.busy)return;I.busy=true;I.err='';I.pct=2;I.msg='جارٍ التحقق…';render();
  try{if((await getDoc(fdoc(FS,'whCfg/items'))).exists())throw new Error('exists');
    const X=I.data,uid=W.user.uid,at=Date.now();
    const mv=X.moves.map((m,i)=>{const o={...m,k:m.d+'-'+String(i).padStart(4,'0'),by:uid,at};for(const x in o)if(o[x]==null)delete o[x];return ['m'+String(i).padStart(4,'0'),o]});
    for(let i=0;i<mv.length;i+=400){const b=writeBatch(FS);for(const [id,o] of mv.slice(i,i+400))b.set(fdoc(FS,'whMoves/'+id),o);await b.commit();I.pct=5+Math.round(Math.min(1,(i+400)/mv.length)*85);I.msg=`جارٍ نقل الحركات… ${Math.min(mv.length,i+400)} من ${mv.length}`;render()}
    const start=X.moves.reduce((a,m)=>m.d<a?m.d:a,'9999');
    const b=writeBatch(FS);b.set(fdoc(FS,'whCfg/lists'),{...X.lists,at,by:uid});b.set(fdoc(FS,'whStock/main'),{s:X.stock,n:mv.length,start,at,by:uid});b.set(fdoc(FS,'whCfg/items'),{items:X.items,at,by:uid,v:1});await b.commit();
    I.busy=false;I.done=true;render()}
  catch(e){I.busy=false;I.err=e.message==='exists'?'بيانات المخازن موجودة بالفعل على الموقع، ولم يتم نقل أي شيء.':'حدثت مشكلة أثناء النقل ('+(e.code||e.message||'خطأ')+'). حاول مرة أخرى.';render()}}
/* ---------- chooser ---------- */
function sysAuto(){try{if(sessionStorage.getItem('elb_sys'))return;sessionStorage.setItem('elb_sys','1')}catch(e){return}openLaunch(1)}
function openLaunch(auto){if($('.wlaunch'))return;const L=document.createElement('div');L.className='wlaunch';const I1='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-3v16M9 21V3l6 3v15M15 21v-9l5 2v7M2 21h20"/></svg>',I2='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>';
  L.innerHTML=`<div class="in"><h1>اختر النظام</h1><p>${esc((W.user&&W.user.name)||'')}</p><div class="wlc"><a href="index.html">${I1}<b>الوحدات والأقساط</b><small>الوحدات والعملاء والأقساط والمدفوعات</small></a><button class="${auto?'':'on'}" data-go="closelaunch">${I2}<b>المخازن</b><small>المعدات والخامات والحركات</small>${auto?'':'<em>أنت هنا</em>'}</button></div>${auto?'':'<button class="x" data-go="closelaunch">إغلاق</button>'}</div>`;document.body.appendChild(L)}
/* ---------- routing / render ---------- */
function route(){const h=location.hash.replace(/^#/,'');const [v,id]=h.split('/');W.view=['eq','mat','moves','item'].includes(v)?v:'home';W.id=id||null;W.sheet=false;W.mvs=null;W.bld=null;W.sure=false;
  if(W.view==='item'&&W.id)loadItem(W.id);if(W.view==='moves'&&!W.all)loadAllMoves();if(W.view==='home')loadRecent();render();scrollTo({top:0})}
function go(v,id){const h=v==='home'?'':'#'+v+(id?'/'+id:'');if(location.hash===h||(!h&&!location.hash)){route();return}location.hash=h||'#home'}
function render(){const app=$('#app');
  if(!W.ready){app.innerHTML='<main class="wrap"><div class="pg2"><div class="skel2"></div><div class="skel2"></div></div></main>';return}
  if(!W.admin){app.innerHTML=`<main class="wrap"><div class="pg2"><div class="wimp"><h2>نظام المخازن</h2><p>هذا القسم متاح لصاحب الحساب فقط في الوقت الحالي.</p><div><a class="btn gold" href="index.html">الرجوع إلى الوحدات والأقساط</a></div></div></div></main>`;return}
  if(!W.D){app.innerHTML=importHTML();return}
  const nv=W.view==='item'?(isEq(D().items[W.id])?'eq':'mat'):W.view;
  document.querySelectorAll('#nav [data-view]').forEach(b=>b.dataset.view===nv?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const keep=document.activeElement&&document.activeElement.id==='wq';const ls=$('#mdl')?$('#mdl').scrollTop:0;
  app.innerHTML=W.view==='home'?home():`<main class="wrap"><div class="pg2">${W.view==='eq'?list('e'):W.view==='mat'?list('m'):W.view==='item'?item(W.id):moves()}</div></main>`;
  const q=$('#wq');if(q){q.oninput=()=>{W.q=q.value;render()};if(keep){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  app.insertAdjacentHTML('beforeend',sheetHTML());
  const md=$('#mdl');if(md&&ls)md.scrollTop=ls}
document.addEventListener('click',e=>{const t=e.target;
  const nav=t.closest('#nav [data-view]');if(nav){W.q='';go(nav.dataset.view);return}
  if(t.closest('#thBtn')){const d=!document.documentElement.classList.contains('dark');setTheme(d);try{localStorage.setItem('elb_theme',d?'dark':'light')}catch(_){}return}
  if(t.closest('#gridBtn')){openLaunch();return}
  if(t.closest('[data-soon]')){toast('تسجيل الحركات يُضاف في الخطوة القادمة.');return}
  const b=t.closest('[data-v]');if(b){const v=b.dataset.v;if(v==='nv'){go('eq');return}if(v==='bl'){go('mat');return}W.tab=v;render();if(innerWidth<761){const m=$('#mp');if(m)m.scrollIntoView({behavior:'smooth',block:'start'})}return}
  const cl=t.closest('[data-close]');if(cl&&(t===cl||t.closest('button[data-close]'))){W.sheet=false;W.mvs=null;W.bld=null;W.sure=false;render();return}
  const mv=t.closest('[data-mv]');if(mv){W.mvs=mv.dataset.mv;W.bld=null;W.sure=false;W.sheet=false;render();return}
  const bd=t.closest('[data-bld]');if(bd){W.bld=[W.id,bd.dataset.bld];W.mvs=null;render();return}
  const op=t.closest('[data-open]');if(op){go('item',op.dataset.open);return}
  const sl=t.closest('[data-sel]');if(sl){W.sel=sl.dataset.sel;W.sheet=innerWidth<761;render();return}
  const it=t.closest('[data-item]');if(it){go('item',it.dataset.item);return}
  const g=t.closest('[data-go]');if(!g)return;const v=g.dataset.go;
  if(v==='closelaunch'){const l=$('.wlaunch');if(l)l.remove();return}
  if(v==='reload'){location.hash='';location.reload();return}
  if(v==='doimport'){runImport();return}
  if(v==='askdel'){W.sure=true;render();return}
  if(v==='nodel'){W.sure=false;render();return}
  if(v==='dodel'){delMove();return}
  if(v==='cancelimp'){W.imp=null;render();return}
  if(v==='more'){W.allN+=60;loadAllMoves();return}
  W.q='';go(v)});
document.addEventListener('change',e=>{if(e.target.id==='whFile'){const f=e.target.files&&e.target.files[0];e.target.value='';pickImport(f)}});
window.addEventListener('hashchange',route);
render();
onAuthStateChanged(AUTH,async u=>{if(!u){location.replace('index.html');return}
  try{const p=await getDoc(fdoc(FS,'users/'+u.uid));const d=p.exists()?p.data():{};W.user={uid:u.uid,name:d.name||''};W.admin=d.role==='admin'&&d.active!==false;
    const av=$('#av');if(av){av.textContent=(d.name||'؟').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('');av.hidden=false}
    if(W.admin)await loadAll()}
  catch(e){W.admin=false}
  W.ready=true;route();if(W.admin)sysAuto()});

</script></body></html>
