<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="البارون">
<meta name="theme-color" content="#13254A">
<title>البارون | متابعة الأقساط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&family=Cinzel:wght@500;600&family=El+Messiri:wght@600&display=swap">
<style>
/* Layout: navy masthead with gold mark, ledger-style content below; summary first, then who needs attention, then detail */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F7F8FC; --line:#E1E6EF; --line-2:#CDD5E3;
  --ink:#121A2E; --muted:#56617A; --faint:#8791A8;
  --navy:#13254A; --navy-2:#1C3363; --navy-ink:#FFFFFF; --navy-muted:#AFC0E0;
  --gold:#B88B2C; --gold-bright:#C9A24A; --gold-soft:#F7EFDC; --gold-ink:#5E440C;
  --late:#B4232A; --late-soft:#FCE8E9; --late-ink:#8E1A20;
  --due:#9A5800; --due-soft:#FFF1D9; --due-ink:#6E3F00;
  --near:#1D56C9; --near-soft:#E7EEFD; --near-ink:#163F94;
  --ok:#0D7449; --ok-soft:#E1F3EA; --ok-ink:#0A5A39;
  --scrim:rgba(10,18,36,.48); --shadow:0 12px 32px rgba(15,26,51,.16),0 2px 6px rgba(15,26,51,.08);
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111E; --surface:#121A2B; --surface-2:#172137; --line:#24304A; --line-2:#33415F;
  --ink:#E6EBF5; --muted:#9AA6C0; --faint:#6F7B96;
  --navy:#0E1B37; --navy-2:#1A2C55; --navy-ink:#FFFFFF; --navy-muted:#9FB2D8;
  --gold:#D8B65E; --gold-bright:#D8B65E; --gold-soft:#2C2512; --gold-ink:#EBD192;
  --late:#FF7A75; --late-soft:#3A1719; --late-ink:#FFA9A5;
  --due:#F5B44A; --due-soft:#352610; --due-ink:#F9CC80;
  --near:#86AAFF; --near-soft:#16244A; --near-ink:#AFC7FF;
  --ok:#4CCB8E; --ok-soft:#0F2C20; --ok-ink:#86E0B3;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B111E; --surface:#121A2B; --surface-2:#172137; --line:#24304A; --line-2:#33415F;
  --ink:#E6EBF5; --muted:#9AA6C0; --faint:#6F7B96;
  --navy:#0E1B37; --navy-2:#1A2C55; --navy-ink:#FFFFFF; --navy-muted:#9FB2D8;
  --gold:#D8B65E; --gold-bright:#D8B65E; --gold-soft:#2C2512; --gold-ink:#EBD192;
  --late:#FF7A75; --late-soft:#3A1719; --late-ink:#FFA9A5;
  --due:#F5B44A; --due-soft:#352610; --due-ink:#F9CC80;
  --near:#86AAFF; --near-soft:#16244A; --near-ink:#AFC7FF;
  --ok:#4CCB8E; --ok-soft:#0F2C20; --ok-ink:#86E0B3;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
.num,td.n,.kv{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.top{position:relative;z-index:30;background:var(--navy);color:var(--navy-ink)}
.top-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px 20px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--gold-bright);color:var(--navy);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;display:block;line-height:1.2}
.brand small{color:var(--navy-muted);font-size:12px;display:block}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;color:var(--navy-muted);padding:8px 14px;border-radius:8px;font-weight:500;white-space:nowrap}
.nav button:hover{color:var(--navy-ink);background:var(--navy-2)}
.nav button[aria-current="page"]{color:var(--navy-ink);background:var(--navy-2);box-shadow:inset 0 -2px 0 var(--gold-bright)}
.acts{display:flex;align-items:center;gap:8px}
.bell{position:relative;width:40px;height:40px;border-radius:10px;border:0;background:var(--navy-2);color:var(--navy-ink);display:grid;place-items:center}
.bell:hover{background:#26407A}
.bdg{position:absolute;top:-6px;left:-6px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:#E5484D;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--navy);font-variant-numeric:tabular-nums}
.bdg.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.av{width:34px;height:34px;border-radius:50%;border:2px solid var(--navy-2);object-fit:cover}
@media (max-width:760px){
  .top-in{grid-template-columns:1fr auto}
  .nav{grid-column:1/-1;order:3;margin-inline:-6px}
  .brand small{display:none}
  .btn-pay-txt{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:8px 14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.gold{background:var(--gold-bright);border-color:var(--gold-bright);color:#16213B;font-weight:600}
.btn.gold:hover{filter:brightness(1.06)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--late);border-color:var(--late-soft);background:var(--late-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* page */
main{padding-block:20px 60px;display:grid;gap:18px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h1{font-size:24px}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pagehead p.welcome{margin:4px 0 2px;color:var(--gold);font-size:15px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.inp,select.inp{height:40px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:0 12px;min-width:0;width:100%}
textarea.inp{height:auto;min-height:64px;padding:8px 12px;resize:vertical}
.inp:focus{outline:2px solid var(--gold-bright);outline-offset:-1px;border-color:transparent}
.filters .inp{width:auto;min-width:150px}
.filters .search{flex:1 1 220px}
.search-wrap{position:relative;flex:1 1 220px;display:flex}
.search-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search-wrap .inp{padding-right:36px;width:100%}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--navy);padding:12px 14px;border-radius:0 0 var(--r) var(--r);display:flex;flex-direction:column;gap:2px;min-width:0;text-align:right}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--line-2)}
.kpi .kl{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .kv{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.kpi .ks{font-size:12px;color:var(--faint)}
.kpi.late{border-top-color:var(--late)}.kpi.late .kv{color:var(--late)}
.kpi.due{border-top-color:var(--due)}.kpi.due .kv{color:var(--due)}
.kpi.gold{border-top-color:var(--gold-bright)}
.kpi.ok{border-top-color:var(--ok)}
.bar{height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold-bright);border-radius:5px}
.bar.ok>i{background:var(--ok)}
.collect{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;flex-wrap:wrap}
.collect .bar{flex:1 1 260px}
.collect b{font-family:var(--f-display);font-size:20px}

/* panels */
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cols2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.cols3,.cols2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15.5px;display:flex;align-items:center;gap:8px}
.panel-h .count{font-family:var(--f-body);font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.dotk{width:9px;height:9px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;background:none;border-inline:0;border-top:0;width:100%}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .main{flex:1;min-width:0}
.li .t1,.li .t2,.upick .t1,.upick .t2,.upick .t3{display:block}
.li .t1{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .amt{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap;text-align:left}
.li .amt{flex:none}.li .amt small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted)}
.more{padding:10px 14px;border-top:1px solid var(--line)}
.empty{padding:22px 16px;color:var(--muted);font-size:13.5px;text-align:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.late{background:var(--late-soft);color:var(--late-ink)}
.pill.due{background:var(--due-soft);color:var(--due-ink)}
.pill.near{background:var(--near-soft);color:var(--near-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}

/* units grid */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip b{font-weight:700;color:var(--ink);margin-inline-start:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] b{color:var(--gold-bright)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:right;min-width:0}
.ucard:hover{border-color:var(--line-2);box-shadow:0 2px 10px rgba(15,26,51,.06)}
.ucard.st-late{box-shadow:inset -3px 0 0 var(--late)}
.ucard.st-due{box-shadow:inset -3px 0 0 var(--due)}
.ucard .uh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ucard .un{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.35}
.ucard .uo{font-size:13px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.trio div{display:flex;flex-direction:column;min-width:0}
.trio span{font-size:11.5px;color:var(--faint)}
.trio b{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.unote{font-size:12.5px;color:var(--late-ink);background:var(--late-soft);padding:5px 9px;border-radius:7px}
.unote.due{color:var(--due-ink);background:var(--due-soft)}
.unote.plain{color:var(--muted);background:var(--surface-2)}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n{white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2)}
.sumline{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* feed */
.feed .li{align-items:flex-start}
.who{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden}
.who img{width:100%;height:100%;object-fit:cover}
.feed .t1{white-space:normal;font-weight:500}
.feed .t1 b{font-weight:700}
.ptot{font-size:12.5px;color:var(--muted);text-align:left;line-height:1.6;white-space:nowrap}
.ptot b{font-size:14.5px;font-variant-numeric:tabular-nums}
.dr-b>*{flex-shrink:0}
.acc-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}.acc-row input{width:18px;height:18px;margin-top:2px;accent-color:var(--gold)}.acc-row span{display:flex;flex-direction:column;gap:2px}.acc-row small{color:var(--muted);font-size:12.5px}
#splash{position:fixed;inset:0;z-index:9999;background:#13254A;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;transition:opacity .25s}#splash.out{opacity:0}#splash .spin{border-color:rgba(201,162,74,.25);border-top-color:#C9A24A}
.push-ban{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);animation:fade .3s ease;max-width:560px;margin:0 auto}
.push-ban .pb-i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.push-ban .pb-t{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px;font-size:13px}.push-ban .pb-t span{color:var(--muted);font-size:12.5px}
.push-ban .pb-a{display:flex;gap:6px;margin-inline-start:auto}
.panel-note{margin:0;padding:8px 14px;font-size:12.5px;line-height:1.7;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.nsec{padding:8px 14px 6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
.nsec span{font-weight:600;font-size:11px;padding:0 6px;border-radius:9px;background:var(--surface);}
.li.nunread{background:color-mix(in srgb,var(--near) 7%,transparent)}
.li.nunread .t1{font-weight:700}
.li.nread{opacity:.72}
.li.nread:hover{opacity:1}
.focus-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--gold-bright);background:var(--gold-soft);color:var(--ink);line-height:1.7;animation:fade .3s ease}
.focus-card.late{border-color:var(--late);background:var(--late-soft)}
.focus-card.near{border-color:var(--near);background:var(--near-soft)}
.focus-card .fk{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.unread-dot{width:8px;height:8px;border-radius:50%;background:#E5484D;flex:none;margin-top:8px}

/* overlay */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s ease}
@keyframes fade{from{opacity:.4}}
.drawer{width:min(760px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .2s ease;margin-inline-start:auto;margin-inline-end:0}
[dir="rtl"] .scrim{justify-content:flex-start}
.dpk{position:relative;display:block}.dpk>.dtx{width:100%;padding-left:44px;font-family:'Readex Pro',inherit;font-variant-numeric:tabular-nums;letter-spacing:.5px;text-align:right}.dpk>input[type=date]{position:absolute;left:0;bottom:0;width:1px!important;height:1px!important;opacity:0;pointer-events:none;border:0;padding:0}
.dcal{all:unset;cursor:pointer;position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}.dcal:hover{background:var(--surface-2);color:var(--ink)}.dcal:disabled{opacity:.4;cursor:default}.dtx.bad{border-color:var(--late)!important}
.dtx::placeholder{letter-spacing:0;font-family:var(--f-body)}
.g-sync{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border-radius:99px;padding:1px 8px;margin-inline-start:6px;cursor:pointer}.g-sync input{width:13px;height:13px;margin:0;accent-color:var(--gold)}
.np-uw{display:flex;gap:6px;padding:10px 14px 4px}.np-uw button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:7px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted)}.np-uw button[aria-pressed=true]{background:var(--navy);color:#fff}:root[data-theme=dark] .np-uw button[aria-pressed=true]{background:var(--gold-bright);color:#0B111E}.np-uw span{font-size:11px;opacity:.8}
.nsec.nday{background:transparent;color:var(--muted);font-weight:700}
.np-clr{margin:10px 14px 0;padding:12px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px}.np-clr small{font-size:11.5px;color:var(--muted)}
.ro-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 11px;border-radius:10px;border:0;background:var(--navy-2);color:var(--navy-ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}.ro-btn.on{background:#F4B740;color:#1B1405}.ro-btn[hidden]{display:none}

.mc-late{--mcc:var(--late);--mcs:var(--late-soft)}.mc-due{--mcc:var(--due);--mcs:var(--due-soft)}.mc-next{--mcc:#5B5FC7;--mcs:#ECEBFF}.mc-near{--mcc:var(--near);--mcs:var(--near-soft)}.mc-free{--mcc:var(--gold);--mcs:var(--gold-soft)}
.mc-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(90deg,transparent,var(--mcs))}
.mc-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--mcs);color:var(--mcc);flex:none}.mc-ic svg{width:18px;height:18px}
.mc-ht{flex:1;min-width:0;display:grid}.mc-ht b{font-size:14px}.mc-ht small{font-size:11px;color:var(--muted)}
.mc-tot{text-align:left;display:grid;flex:none}.mc-tot b{font-size:16px;color:var(--mcc)}.mc-tot small{font-size:11px;color:var(--muted)}
.mc-l{display:grid}
.mc-r{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);width:100%}button.mc-r{cursor:pointer}button.mc-r:hover{background:var(--surface-2)}
.mc-n{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.mc-m{flex:1;min-width:0;display:grid;line-height:1.45}.mc-m b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc-m small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc-m em{font-style:normal;font-size:11px;color:var(--mcc);font-weight:600}
.mc-a{font-size:14px;font-weight:700;color:var(--mcc);flex:none}
.mc-more{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--muted);border-top:1px dashed var(--line-2)}.mc-more:hover{color:var(--ink)}
.mc-note{padding:9px 12px;font-size:13px;line-height:1.7;border-top:1px solid var(--line);background:var(--surface-2);white-space:pre-line}
.mc-free .mc-note{font-size:14.5px;background:transparent;border-top:0;padding-top:4px}
.ms-pv2{max-height:300px;overflow:auto;border-radius:14px}
.ms-push{display:grid;gap:3px;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:9px 11px}.ms-push b{color:var(--ink);font-weight:500;font-size:12.5px;line-height:1.6}

.bd-layer{position:fixed;inset:0;z-index:85;display:grid;place-items:center}
.ms-ic.red{background:var(--late-soft);color:var(--late)}
.bd-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd-n{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center;display:grid}.bd-n b{font-size:20px}.bd-n small{font-size:11.5px;color:var(--muted)}
.bd-warn{display:grid;gap:4px;padding:11px 13px;border-radius:12px;background:var(--late-soft);color:var(--late-ink);font-size:12.5px;line-height:1.7;border:1px solid color-mix(in srgb,var(--late) 30%,transparent)}.bd-warn b{font-size:13.5px}
.bd-warn.info{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.bd-chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.bd-chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}.bd-chk span{display:grid}.bd-chk b{font-size:13px}.bd-chk small{font-size:11.5px;color:var(--muted)}
.bd-err{padding:9px 12px;border-radius:10px;background:var(--late);color:#fff;font-size:13px;font-weight:600}
.bd-prog{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}.bd-prog>i{display:block;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}.bd-prog>i>i{display:block;height:100%;background:var(--late);transition:width .3s}
.btn.bd-go{background:var(--late);border-color:var(--late);color:#fff;font-weight:700}.btn.bd-go:disabled{opacity:.45}
.bd-done{text-align:center;padding:16px 6px;display:grid;gap:6px;justify-items:center}.bd-done span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);font-size:28px;font-weight:800}.bd-done b{font-size:18px}.bd-done p{margin:0;font-size:13.5px;line-height:1.8;color:var(--muted)}
.bd-info{font-size:13.5px}
.dm .dm-r{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}.dm .dm-r>div{flex:1;min-width:0;display:grid;gap:2px}.dm .dm-r b{font-size:14px}.dm .dm-r small{font-size:12px;color:var(--muted);line-height:1.6}
.dm-i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);flex:none}.dm-i svg{width:19px;height:19px}
/* chooser */
.wlaunch{position:fixed;inset:0;z-index:70;background:linear-gradient(160deg,#0E1B37,#13254A 60%,#1C3363);color:#fff;display:grid;place-items:center;padding:24px 16px;overflow:auto;animation:msIn .25s ease}
.wlaunch .in{width:min(760px,100%);display:grid;gap:18px}
.wlaunch h1{margin:0;font:600 26px var(--f-display,'Readex Pro'),sans-serif;text-align:center}.wlaunch p{margin:0;text-align:center;color:#AFC0E0}
.wlc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.wlc{grid-template-columns:1fr}}
.wlc a,.wlc button{display:grid;gap:6px;text-align:start;text-decoration:none;color:#fff;font:inherit;padding:20px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);cursor:pointer;position:relative;overflow:hidden}
.wlc a:hover,.wlc button:hover{background:rgba(255,255,255,.1)}
.wlc .on{border-color:#C9A24A;box-shadow:inset 0 0 0 1px #C9A24A}
.wlc b{font:600 19px var(--f-display,'Readex Pro'),sans-serif}.wlc small{color:#C9D4EC;font-size:13px;line-height:1.7}.wlc em{font-style:normal;color:#E2BE6A;font-size:12.5px;font-weight:600}
.wlc svg{width:30px;height:30px;color:#E2BE6A}
.wlaunch .x{justify-self:center;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 18px;font:inherit;cursor:pointer}
.wgrid-btn{display:grid;place-items:center}
.nav .nav-grid{display:none}
@media (max-width:760px){.acts #gridBtn{display:none!important}.nav .nav-grid:not([hidden]){display:inline-grid;place-items:center;padding:8px 10px}.nav .nav-grid svg{width:18px;height:18px}}

.bka .bka-st{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px}
.bka .bka-st>div{flex:1;min-width:200px;display:grid;gap:3px}
.bka .bka-st b{font-size:14.5px}.bka small{font-size:12.5px;color:var(--muted);line-height:1.6}
.bka-dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px var(--ok-soft);flex:none;margin-inline:4px}
.bka-st.bad .bka-dot{background:var(--late);box-shadow:0 0 0 5px var(--late-soft)}
.bka .bka-st .btn{flex:none;width:auto;margin:0}
.bka-tabs{display:flex;gap:6px;padding:0 14px 12px}
.bka-tabs button{flex:1;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
.bka-tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.bka-tabs i{font-style:normal;font-size:12px;opacity:.75;margin-inline-start:4px}
.bka-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.bka-r>div{flex:1;min-width:180px;display:grid;gap:2px}.bka-r b{font-size:14px}
.bka-r .bka-a{display:flex;gap:8px;flex:none}
.bka-r .bka-a .btn{width:auto;margin:0;min-height:40px;flex:none;font-size:14px}
.bka-tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);margin-inline-start:6px}
.bka-nil{padding:16px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.bka-m{padding:14px;border-top:1px solid var(--line);display:grid;gap:10px}
.bka-mh{display:flex;justify-content:space-between;align-items:center;gap:8px}.bka-mh>span{display:grid;gap:2px}
.bka-g{font-size:12px;font-weight:600;padding:3px 10px;border-radius:9px;background:var(--ok-soft);color:var(--ok-ink)}
.bka-g.mid{background:var(--due-soft);color:var(--due-ink)}.bka-g.hi{background:var(--late-soft);color:var(--late-ink)}
.bka-bar{height:12px;border-radius:8px;background:var(--surface-2);overflow:hidden}.bka-bar i{display:block;height:100%;border-radius:8px;background:var(--ok);min-width:6px}
.bka-bar.mid i{background:var(--due)}.bka-bar.hi i{background:var(--late)}
.bka-ml{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}.bka-ml b{color:var(--ink);font-size:15px}
.bka-s3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bka-s3>div{background:var(--surface-2);border-radius:11px;padding:10px;display:grid;gap:2px}.bka-s3 b{font-size:14.5px}
.bka-ld,.bka-e{padding:16px 14px;color:var(--muted);font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bka-e .btn{width:auto;margin:0;flex:none}
.bka-warn{margin:0 14px 12px;padding:10px 12px;border-radius:11px;background:var(--late-soft);color:var(--late-ink);font-size:13px;line-height:1.7}
@media (max-width:560px){.bka-s3{grid-template-columns:1fr 1fr}.bka-r .bka-a{width:100%}.bka-r .bka-a .btn{flex:1}.bka .bka-st .btn{width:100%}}
.dm-r.danger .dm-i{background:var(--late-soft);color:var(--late)}
.dm .dm-r label.btn{cursor:pointer}
@media (max-width:900px){.bd-layer{place-items:end center}.bd-g{grid-template-columns:repeat(3,1fr)}.dm .dm-r{flex-wrap:wrap}.dm .dm-r .btn{margin-inline-start:50px}}
@media (prefers-reduced-motion:reduce){.wc-tw path{stroke-dashoffset:0}.wc-tx small span{opacity:1;transform:none}.wc-tx b{clip-path:none}.wc-rg{stroke-dashoffset:var(--off)}}

.gate.night .bl-logo2{background:#EEF2FA}
@keyframes blUp{from{clip-path:inset(100% 0 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.bl-sub{text-align:center;flex:none;color:var(--sub);font-family:'El Messiri',var(--f-display);font-weight:600;font-size:26px;letter-spacing:0;line-height:1.4;opacity:0;animation:blFi 1.4s ease 1.7s forwards}
.bl-city{position:absolute;left:0;right:0;bottom:0;width:100%;height:40%}
.bl-ln{stroke-dasharray:2600;stroke-dashoffset:2600;animation:blDr 3.2s cubic-bezier(.45,0,.25,1) forwards}
.bl-cl{stroke-dasharray:1400;stroke-dashoffset:1400;animation:blDr 3.4s cubic-bezier(.45,0,.25,1) forwards}
@keyframes blDr{to{stroke-dashoffset:0}}
.bl-fi{opacity:0;animation:blFi 1.6s ease forwards}
@keyframes blFi{to{opacity:1}}
.bl-lf{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.85);animation:blLf 1.4s ease forwards}
@keyframes blLf{to{opacity:1;transform:none}}
.bl-sway{transform-box:fill-box;transform-origin:bottom center;animation:blSw 6s ease-in-out 6s infinite alternate}
@keyframes blSw{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.bl-jib{transform-box:view-box;transform-origin:1040px 112px;animation:blJb 14s ease-in-out 6s infinite alternate}
@keyframes blJb{to{transform:rotate(-6deg)}}
@media (max-width:820px){
  .gate .gate-art{min-height:max(250px,min(46vh,calc(100dvh - 450px)))}
  .gate-side{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .bl-top{top:5%;bottom:38%;gap:6px}
  .bl-logo{width:76%;max-height:calc(100% - 40px)}
  .bl-logo2{width:62%;max-height:calc(100% - 40px)}
  .bl-sub{font-size:22px;padding:0 12px}
  .bl-city{height:36%}
}
@media (prefers-reduced-motion:reduce){.gate .gate-art *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important;clip-path:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* welcome header variants */
.wg{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;overflow:hidden}
.wg h1{margin:0;font-size:26px;line-height:1.3}
.wg-main{flex:1;min-width:220px;display:grid;gap:4px;position:relative;z-index:1}
.wg-eb{font-size:12.5px;font-weight:600;color:var(--gold);letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.wg-sub{margin:0;color:var(--muted);font-size:13px}
.wg-brief{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.7}
.wg-brief b{font-weight:700;color:var(--ink)}.wg-brief b.r{color:#C0392B}.wg-brief b.a{color:#A8741A}.wg-brief b.b{color:#4F56B8}
[data-theme=dark] .wg-brief b.r{color:#FF8A80}[data-theme=dark] .wg-brief b.a{color:#F2C46B}[data-theme=dark] .wg-brief b.b{color:#A9B0FF}
.wg-side{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.wg-av{display:flex;flex-direction:row-reverse}
.wg-av i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;letter-spacing:-.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border:2px solid var(--surface);margin-inline-start:-8px;position:relative;filter:grayscale(1);opacity:.75}
.wg-av i.on{background:var(--gold-soft);color:var(--gold-ink);filter:none;opacity:1}
.wg-av i.on::after{content:'';position:absolute;bottom:-1px;left:-1px;width:9px;height:9px;border-radius:50%;background:#1f9d55;border:2px solid var(--surface)}
.wg-av i.more{filter:none;opacity:1;background:var(--surface);color:var(--muted)}
.wg-pres{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer}
.wg-wm{position:absolute;color:var(--gold);opacity:.07;pointer-events:none}.wg-wm svg{width:100%;height:100%}

async function runBD(){if(roBlock())return;if(!BD||BD.busy)return;const st=BD.st;if(!st||!st.ids.length)return;
  BD.busy=true;BD.err='';BD.prog='جارٍ التحقق من كلمة المرور…';BD.pct=3;renderBD();

  catch(e){BD.busy=false;const c=e&&e.code||'';BD.err=c==='auth/too-many-requests'?'محاولات كثيرة خاطئة. انتظر قليلاً ثم حاول مرة أخرى.':c==='auth/network-request-failed'?'لا يوجد اتصال بالإنترنت.':'كلمة المرور غير صحيحة.';BD.pw='';renderBD();return}
  BD.pw='';
  try{
    if(BD.backup){await makeBackup(BD.plot,t=>{BD.prog=t;BD.pct=8;renderBD()})}
    const ops=[];for(const p of st.pays)ops.push(['del','payments/'+p.id]);for(const f of st.fids)ops.push(['del','files/'+f]);
    for(const id of st.ids){ops.push(['del','unitInst/'+id]);ops.push(['del','unitPriv/'+id])}for(const id of st.ids)ops.push(['del','units/'+id]);

    await batchRun(ops,(d,t)=>{BD.prog=`جارٍ الحذف… ${d} من ${t}`;BD.pct=10+Math.round(d/t*90);renderBD()});
    const what=BD.plot?`كل وحدات «${BD.plot}» (${st.ids.length} وحدة)`:`كل الوحدات في كل القطع (${st.ids.length} وحدة)`;
    logAct('team','حذف '+what,null,[]);
    BD.busy=false;BD.done=`تم حذف ${what} مع ${st.pays.length} دفعة و${st.insts} قسط${st.fids.length?' و'+st.fids.length+' صورة':''}.${BD.backup?' والنسخة الاحتياطية اتنزلت على جهازك.':''}`;renderBD()
  }catch(e){BD.busy=false;BD.err='حصلت مشكلة أثناء الحذف ('+(e&&e.code||e&&e.message||'خطأ')+'). جزء من البيانات ربما اتحذف — حاول مرة أخرى.';renderBD()}}

async function compressImg(file){const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1600,q=.72,out='',w=0,h=0;
    for(let k=0;k<8;k++){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));w=Math.round(img.naturalWidth*sc);h=Math.round(img.naturalHeight*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      out=c.toDataURL('image/jpeg',q);if(out.length<600000)break;if(q>.52)q-=.1;else max=Math.round(max*.8)}
    return out.length<900000?{data:out,w,h}:null}
  catch(e){return null}finally{URL.revokeObjectURL(url)}}

function genPlan(){const g=E.gen,price=num(E.f.price),down=num(g.down),n=Math.max(0,Math.round(num(g.n))),ev=Math.max(1,num(g.every));
  const dd=(g.sync&&E.f.contract)?E.f.contract:(g.downDate||TODAY);let first=g.first;if(!first){const d=new Date(dd+'T00:00');d.setMonth(d.getMonth()+ev);first=iso(d)}
  const rest=price-down,per=n?Math.floor(rest/n/1000)*1000:0,last=n?rest-per*(n-1):0;return {price,down,n,ev,dd,first,rest,per,last,autoFirst:!g.first}}
function genCalcHTML(){const P=genPlan();const evl={1:'شهر',2:'شهرين',3:'3 شهور',4:'4 شهور',6:'6 شهور',12:'سنة'}[P.ev]||P.ev+' شهور';
  if(!P.price)return `<div class="gc-warn">اكتب <b>السعر الإجمالي</b> فوق في «المالك والتعاقد» الأول، عشان نقدر نحسب الأقساط.</div>`;
  if(P.down>P.price)return `<div class="gc-warn">المقدم أكبر من السعر الإجمالي.</div>`;
  if(!P.n&&P.down!==P.price)return `<div class="gc-warn">اكتب عدد الأقساط.</div>`;
  const lastD=(()=>{const d=new Date(P.first+'T00:00');d.setMonth(d.getMonth()+P.ev*(P.n-1));return dDate(iso(d))})();
  return `<div class="gc-r"><span>المقدم ${P.down?`<small>(يوم ${dDate(P.dd)})</small>`:''}</span><b class="num">${fmt(P.down)}</b></div>
   <div class="gc-r t"><span>الباقي بعد المقدم</span><b class="num">${fmt(P.rest)}</b></div>
   ${P.n?`<div class="gc-r"><span>هيتقسم على ${P.n} أقساط، كل قسط</span><b class="num">${fmt(P.per)}</b></div>
   ${P.last!==P.per?`<div class="gc-s">آخر قسط ${fmt(P.last)} عشان الحساب يقفل مظبوط</div>`:''}
   <div class="gc-s">قسط كل ${evl} — أول قسط <b class="num">${dDate(P.first)}</b> وآخر قسط <b class="num">${lastD}</b></div>`:''}`}

function genSchedule(){
  if(E.gen.sync&&E.f.contract)E.gen.downDate=E.f.contract;
  const g=E.gen,price=num(E.f.price),down=num(g.down),n=Math.max(0,Math.round(num(g.n))),ev=Math.max(1,num(g.every));
  if(!price){genCalcUpd();const pi=document.getElementById('e_price');if(pi){pi.scrollIntoView({behavior:'smooth',block:'center'});pi.classList.add('need');setTimeout(()=>pi.focus({preventScroll:true}),350)}toast('اكتب السعر الإجمالي الأول',true);return}
  if(n<1&&down!==price){genCalcUpd();toast('اكتب عدد الأقساط',true);return}
  const rest=price-down,per=n?Math.floor(rest/n/1000)*1000:0;
  const out=[];if(down)out.push({id:'i'+Math.random().toString(36).slice(2,9),label:'مقدم',due:g.downDate||'',amount:String(down),note:''});
  let first=g.first;if(!first){const d=new Date((g.downDate||TODAY)+'T00:00');d.setMonth(d.getMonth()+ev);first=iso(d)}
  for(let i=0;i<n;i++){const d=new Date(first+'T00:00');d.setMonth(d.getMonth()+ev*i);out.push({id:'i'+Math.random().toString(36).slice(2,9),label:'قسط '+(i+1),due:iso(d),amount:String(i===n-1?rest-per*(n-1):per),note:''})}
  E.insts=out;E.err='';renderEditor();
}

async function pushRegister(ask){
  if(!PUSH_OK()||!S.me)return 'unsupported';
  try{
    if(ask&&Notification.permission==='default'){const r=await Notification.requestPermission();if(r!=='granted')return r}
    if(Notification.permission!=='granted')return Notification.permission;
    const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js');
    if(!(await m.isSupported()))return 'unsupported';
    const tok=await m.getToken(m.getMessaging(FA),{vapidKey:CFG.vapidKey,serviceWorkerRegistration:reg});
    if(!tok)return 'error';
    let old='';try{old=localStorage.getItem('elb_push_tok')||''}catch(e){}
    const upd={tokens:{[tok]:Date.now()}};
    await S.db.doc('push/'+S.me).merge(upd);
    try{localStorage.setItem('elb_push_tok',tok)}catch(e){}
    return 'granted';
  }catch(e){console.warn('push',e);S.pushErr=String((e&&(e.code||e.name))||'')+' '+String((e&&e.message)||'').slice(0,120);return 'error'}
}

  if(e.key==='Enter'&&W&&W.step===2&&e.target.tagName==='INPUT'){e.preventDefault();$('[data-act="w-next"]')?.click()}});

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.dcal');if(!b||b.disabled)return;e.preventDefault();const h=b.parentNode.querySelector('input[type=date]');try{h.showPicker()}catch(x){h.focus();h.click()}},true);
document.addEventListener('change',e=>{const t=e.target;if(t.type==='date'&&t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains('dpk')){const v=t.parentNode.querySelector('.dtx');if(v)v.value=t.value?dDate(t.value):'';t.dispatchEvent(new Event('input',{bubbles:true}))}},true);
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('dtx')){const h=t.parentNode.querySelector('input[type=date]');if(t.value&&!h.value)t.classList.add('bad');else if(h.value)t.value=dDate(h.value)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();
  if(f.id==='gateForm')gateSubmit();else if(f.id==='pwForm')changePw();else if(f.id==='teamForm')createMember();});
/* ---------- data ---------- */
let idleAt=Date.now();
['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,()=>{idleAt=Date.now()},{passive:true}));
setInterval(()=>{if(AUTH&&AUTH.currentUser&&Date.now()-idleAt>30*60*1000){signOut(AUTH);G.err='';G.ok='تم تسجيل الخروج تلقائياً لعدم الاستخدام لمدة 30 دقيقة.'}},30000);
function refresh(){recompute();renderBadge();
  if(S.gate!=='in')return;
  const ae=document.activeElement;const typing=ae&&ae.closest&&ae.closest('#main .filters');
  if(!$('#res'))renderView();else if(!typing&&(!S._shapeOk)){renderView();S._shapeOk=true}else renderResults();
  if(S.drawer&&!W&&!E)renderDrawer();if(S.np)renderNP();
}
function stopData(){S.dataGen=(S.dataGen||0)+1;for(const u of S.unsubs)try{u()}catch(e){};S.unsubs=[];S.dataStarted=false;S._base={};S._inst={};S._priv={};S.units={};S.payments=[];S.activity=[];S.loaded={units:false,payments:false};S.actInit=false;S._shapeOk=false;S._instOk=false}
function startData(){
  S.dataGen=S.dataGen||0;S.dataStarted=true;const db=S.db;const U=S.unsubs;
  const timer=setTimeout(()=>{if(!S.loaded.units){S.slow=true;renderView()}},10000);
  U.push(db.doc('state/'+S.me).onSnapshot(s=>{if(s.exists){const d=s.data();const o0=S.ustate;const clr=Math.max(d.clr||0,S.ustate.clr||0);if((d.lastSeen||0)>(S.ustate.lastSeen||0))S.ustate={lastSeen:d.lastSeen||0,seen:{...(d.seen||{})},clr};else if((d.lastSeen||0)===(S.ustate.lastSeen||0))S.ustate={lastSeen:d.lastSeen||0,seen:{...(d.seen||{}),...(S.ustate.seen||{})},clr};else S.ustate={...S.ustate,clr};{const u=S.ustate;const h={...(d.hid||{}),...(o0.hid||{})};if(Object.keys(h).length)u.hid=h;if((d.exAt||0)>=(o0.exAt||0)){if(d.exAt){u.ex=d.ex||[];u.exAt=d.exAt}}else{u.ex=o0.ex||[];u.exAt=o0.exAt}if(JSON.stringify(u.ex||[])!==JSON.stringify(o0.ex||[])&&S.view!=='home'&&S.view!=='team'&&$('#res'))renderView()}}S.ustateLoaded=true;renderBadge();if(S.np)renderNP();if(S.view==='home'&&$('#res'))renderResults()},()=>{S.ustateLoaded=true;renderBadge()}));
  U.push(db.collection('users').onSnapshot(s=>{const m={};for(const d of s.docs)m[d.id]={...d.data(),id:d.id};S.users=m;if(S.view==='team'&&$('#res'))renderResults();if(S.np)renderNP()},()=>{}));
  const gen=++S.dataGen;
  db.doc('meta/schema').get().then(m=>{if(gen!==S.dataGen)return;S.schema=m.exists?(m.data().v||1):1;startData2(timer)}).catch(()=>{if(gen!==S.dataGen)return;S.schema=1;startData2(timer)});
}
function startData2(timer){
  const db=S.db;const U=S.unsubs;const A=S.acc=ACC();const V2=S.schema>=2;
  const unitsDone=()=>{S.loaded.units=true;clearTimeout(timer);S.slow=false;S._shapeOk=false;refresh();afterUnitsLoaded()};
  const multi=(col,extra,cb,errcb)=>{const parts={};const push=(k,docs)=>{parts[k]=docs;const all=[];for(const x in parts)all.push(...parts[x]);cb(all)};
    if(A.all){let q=db.collection(col);if(extra)q=extra(q);U.push(q.onSnapshot(s=>push('*',s.docs),errcb))}
    else if(!A.plots.length)setTimeout(()=>cb([]),0);
    else for(const pl of A.plots){let q=db.collection(col).where('plot','==',pl);if(extra)q=extra(q);U.push(q.onSnapshot(s=>push(pl,s.docs),errcb))}};
  if(!V2){
    U.push(db.collection('units').onSnapshot(s=>{const m={};for(const d of s.docs)m[d.id]={...d.data(),id:d.id};S.units=m;unitsDone()},e=>{S.loaded.units=true;writeFail(e);refresh()}));
  }else{
    S._base={};S._inst={};S._priv={};
    const merge=()=>{const m={};for(const id in S._base){const b=S._base[id];m[id]={...b,id,insts:(S._inst[id]||{}).insts||[],phone:(S._priv[id]||{}).phone||'',nid:(S._priv[id]||{}).nid||''}}S.units=m};
    let gotBase=false;
    multi('units',null,docs=>{const m={};for(const d of docs)m[d.id]=d.data();S._base=m;merge();gotBase=true;unitsDone()},e=>{S.loaded.units=true;writeFail(e);refresh()});
    if(A.insts)multi('unitInst',null,docs=>{const m={};for(const d of docs)m[d.id]=d.data();S._inst=m;S._instOk=true;merge();if(gotBase)refresh()},()=>{});
    if(A.owner)multi('unitPriv',null,docs=>{const m={};for(const d of docs)m[d.id]=d.data();S._priv=m;merge();if(gotBase)refresh()},()=>{});
  }
  if(A.pays)multi('payments',null,docs=>{S.payments=docs.map(d=>({...d.data(),id:d.id}));S.loaded.payments=true;refresh()},()=>{S.loaded.payments=true;refresh()});
  else{S.payments=[];S.loaded.payments=true}
  const onAct=(docs,changes,fromCache)=>{
    S.activity=docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,200);
    if(S.actInit&&S.gate==='in'){for(const ch of changes){if(ch.type==='added'){const a=ch.doc.data();if(forMe(a)&&Date.now()-a.ts<120000){toast(whoName(a.by)+' '+a.text);sysNotify(BRAND,whoName(a.by)+' '+a.text)}}}}
    if(!fromCache)S.actInit=true;
    refresh();
  };
  if(!V2||A.full||(A.all&&A.pays))U.push(db.collection('activity').orderBy('ts','desc').limit(200).onSnapshot(s=>onAct(s.docs,s.docChanges(),s.metadata.fromCache),()=>{}));
  else{const parts={};const ex=q=>A.pays?q.limit(200):q.where('sens','==',false).limit(200);
    const go=(k,s)=>{parts[k]=s.docs;const all=[];for(const x in parts)all.push(...parts[x]);onAct(all,s.docChanges(),s.metadata.fromCache)};
    if(A.all)U.push(ex(db.collection('activity')).onSnapshot(s=>go('*',s),()=>{}));
    else for(const pl of A.plots)U.push(ex(db.collection('activity').where('plot','==',pl)).onSnapshot(s=>go(pl,s),()=>{}));}
}
function hideSplash(){setTimeout(()=>{document.documentElement.style.background=''},300);const x=document.getElementById('splash');if(x){x.classList.add('out');setTimeout(()=>x.remove(),250)}}
async function boot(){
  try{if(localStorage.getItem('elb_auth')==='1'){const sp=document.createElement('div');sp.id='splash';sp.innerHTML='<svg viewBox="440 0 700 720" width="84" height="86" fill="none" stroke="#C9A24A" stroke-width="16" stroke-linejoin="round"><path d="M505 695V548L570 485L582 497L530 550V695M978 497L1043 548V695H1022V560L970 515M598 695V298L657 240L668 250L625 300V695M895 330L962 385V695H940V398L888 352M680 695V25L882 213V695Z"/><path d="M450 712H1100"/></svg><div class="spin"></div>';try{const p=localStorage.getItem('elb_theme')||'auto',h=new Date().getHours(),nt=p==='dark'||(p!=='light'&&(h>=18||h<6));sp.style.background=nt?'#0B111E':'#F3F5FA'}catch(e){}document.body.appendChild(sp);setTimeout(hideSplash,8000)}}catch(e){}
  document.title=BRAND;$('#brandName').textContent=bnName();
  try{const bn=(new URLSearchParams(location.search).get('bn')||'Y1').toUpperCase();if(bn){document.documentElement.dataset.bn=bn;const sb=$('#brandSub');sb.textContent=bn==='B2'?'EL BARON':'للاستثمار العقاري والمقاولات';if(bn==='Y1'){matchMedia('(max-width:760px)').addEventListener('change',()=>{$('#brandName').textContent=bnName()})}if(bn==='Y3'){const d=$('#brandName').parentElement;d.insertBefore(sb,d.firstChild)}if(bn==='T4')sb.innerHTML='<span>للاستثمار العقاري</span><span>والمقاولات</span>';if(/^W\d|^X|^Y/.test(bn)){if(bn[0]==='W')sb.innerHTML='<span>للاستثمار العقاري</span> <span>والمقاولات</span>';const bb=$('#brandName');bb.dataset.t=bb.textContent;const bd=bb.parentElement;bd.classList.add('wm');bd.addEventListener('click',()=>{bd.classList.remove('wm-tap');void bd.offsetWidth;bd.classList.add('wm-tap')})}if(bn==='ART')sb.innerHTML='<span>للاستثمار العقاري</span> <span>والمقاولات</span>';if(bn==='T2')sb.innerHTML='للاستثمار العقاري<i></i>والمقاولات'}}catch(e){}
  try{const st=JSON.parse(localStorage.getItem('aq_state')||'null');if(st)S.ustate=st}catch(e){}
  if(!CONFIGURED){S.gate='config';renderGate();return}
  S.db=DB;try{if(S.gate==='loading'&&localStorage.getItem('elb_auth')!=='1')S.gate='login'}catch(e){}renderGate();
  onAuthStateChanged(AUTH,async user=>{
    if(!user){
      try{localStorage.removeItem('elb_auth')}catch(e){}hideSplash();
      if(profUnsub){profUnsub();profUnsub=null}stopData();stopPresence();S.me=null;S.users={};S.role=null;closeLayer();S.np=null;renderNP();
      if(!S.setupDone){try{const m=await DB.doc('meta/setup').get();S.setupDone=m.exists}catch(e){S.setupDone=true}}
      S.gate=S.setupDone?'login':'setup';renderGate();return}
    try{localStorage.setItem('elb_auth','1')}catch(e){}
    S.me=user.uid;S.gate='loading';renderGate();watchProfile(user);
  });
}
boot();
